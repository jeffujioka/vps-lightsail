[project]
name = "conf-push"
version = "0.1.0"
description = "VPS Lightsail VPN — setup, teardown, and config push to devices"
requires-python = ">=3.14"
dependencies = [
    "zeroconf>=0.131.0",
    "httpx>=0.27.0",
]

[project.scripts]
vps-lightsail = "vps_lightsail.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vps_lightsail"]
