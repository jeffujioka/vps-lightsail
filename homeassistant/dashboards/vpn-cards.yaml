status:
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: sensor.vps_lightsail_state
    name: VPN
    card_layout: large
    state_content: [state, last-changed]
    sub_button:
      - {entity: sensor.vps_lightsail_ip, icon: mdi:ip-network, state_content: state, show_background: false}
      - {entity: sensor.vps_lightsail_region, icon: mdi:earth, state_content: state, show_background: false}
    styles: |
      ${(() => {
        const W = 'var(--warning-color)', D = 'var(--disabled-color)', E = 'var(--error-color)';
        const m = {healthy: ['mdi:shield-check', 'var(--success-color)'],
          starting: ['mdi:progress-clock', W], creating: ['mdi:progress-clock', W],
          provisioning: ['mdi:progress-clock', W], wg_down: ['mdi:shield-alert', W],
          unreachable: ['mdi:shield-off', E], error: ['mdi:shield-off', E],
          stopping: ['mdi:power-sleep', D], stopped: ['mdi:power-sleep', D],
          destroying: ['mdi:delete-clock', D], nonexistent: ['mdi:cloud-off-outline', D],
          unavailable: ['mdi:lan-disconnect', E]};
        const [i, c] = m[state] || ['mdi:help-circle', D];
        icon.setAttribute('icon', i);
        return `.bubble-icon { color: ${c} !important; }`;
      })()}
  - type: conditional
    conditions: [{condition: state, entity: binary_sensor.vps_lightsail_problem, state: "on"}]
    card:
      type: markdown
      content: >-
        **Problem:** {{ states('sensor.vps_lightsail_state') }}
        {%- set e = state_attr('sensor.vps_lightsail_state', 'error') %}{% if e %} — {{ e }}{% endif %}
        · since {{ state_attr('sensor.vps_lightsail_state', 'since') }}
controls:           # spec-05 §5.2 Start/Stop, both targets (R24); spec-06 cards: usage@dashboard, peers@* (06e)
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.vps_lightsail_state
        state: [stopped, error]
    card:
      type: custom:bubble-card
      card_type: button
      button_type: name
      entity: button.vps_lightsail_start
      name: Start VPN
      icon: mdi:play
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.vps_lightsail_start
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.vps_lightsail_state
        state: [healthy, wg_down, unreachable, starting, error]
    card:
      type: custom:bubble-card
      card_type: button
      button_type: name
      entity: button.vps_lightsail_stop
      name: Stop VPN
      icon: mdi:stop
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.vps_lightsail_stop
controls@dashboard: # spec-05 §5.2 last-command card; the home pop-up has no room for it
  - type: markdown
    content: >-
      {% set r = 'sensor.vps_lightsail_last_result' %}
      {% if states(r) not in ['unknown', 'unavailable'] %}
      **Last command:** {{ state_attr(r, 'action') }} —
      {{ {'running': '⏳', 'ok': '✅', 'failed': '❌', 'rejected': '⚠️',
          'busy': '⚠️', 'interrupted': '⚠️'}.get(state_attr(r, 'outcome'), '') }}
      {{ states(r) }}
      <br><small>{{ (state_attr(r, 'finished_at') or state_attr(r, 'started_at'))
      | as_datetime | as_local | relative_time }} ago</small>
      {% endif %}
usage:
  - type: grid
    columns: 2
    square: false
    cards:
      - {type: custom:bubble-card, card_type: button, button_type: state,
         entity: sensor.vps_lightsail_data_total, name: Data this month, icon: mdi:swap-vertical}
      - {type: custom:bubble-card, card_type: button, button_type: state,
         entity: sensor.vps_lightsail_allowance_pct, name: Allowance used, icon: mdi:gauge}
      - {type: custom:bubble-card, card_type: button, button_type: state,
         entity: sensor.vps_lightsail_cost_month, name: Cost month (est.), icon: mdi:currency-usd}
      - {type: custom:bubble-card, card_type: button, button_type: state,
         entity: sensor.vps_lightsail_cost_projected, name: Projected (est.), icon: mdi:chart-line}
usage@dashboard:    # plan 06e: spec-06 §8.2 "Server" (Create/Destroy ask first, D19); Start/Stop stay right under the state (spec-05 §5.2)
  - type: grid
    title: Server
    cards:
      - type: tile
        entity: select.vps_lightsail_region_select
        name: Region for next create
        features: [{type: select-options}]
      - type: tile
        entity: button.vps_lightsail_create
        name: Create VPN server
        icon: mdi:cloud-plus
        visibility:
          - {condition: state, entity: sensor.vps_lightsail_state, state: nonexistent}
        tap_action:
          action: perform-action
          perform_action: button.press
          target: {entity_id: button.vps_lightsail_create}
          confirmation:
            text: Create the VPN server in the selected region? Billing starts (~$5/month, ~$0.007/h).
      - type: tile
        entity: button.vps_lightsail_destroy
        name: Destroy VPN server
        icon: mdi:cloud-remove
        visibility:
          - {condition: state, entity: sensor.vps_lightsail_state, state_not: nonexistent}
        tap_action:
          action: perform-action
          perform_action: button.press
          target: {entity_id: button.vps_lightsail_destroy}
          confirmation:
            text: Destroy the VPN server? Every device config (Shield, iPhone QR) stops working. Stops all charges.
      - type: tile
        entity: sensor.vps_lightsail_last_result     # progress text + ok/null/false (spec-05)
        name: Last command
peers:
  - type: custom:bubble-card
    card_type: separator
    name: Peers
    icon: mdi:account-network
    sub_button:
      - {entity: sensor.vps_lightsail_peers_connected, state_content: state, show_background: false}
  - type: grid
    columns: 2
    square: false
    cards:
      - {type: custom:bubble-card, card_type: button, button_type: state,
         entity: binary_sensor.vps_lightsail_peer_shield, name: Shield, icon: mdi:television}
      - {type: custom:bubble-card, card_type: button, button_type: state,
         entity: binary_sensor.vps_lightsail_peer_iphone, name: iPhone, icon: mdi:cellphone}
peers@dashboard:    # plan 06e: spec-06 §8.2 "Devices" (hidden while nonexistent, the QR with it)
  - type: grid
    title: Devices
    visibility:
      - {condition: state, entity: sensor.vps_lightsail_state, state_not: nonexistent}
    cards:
      - type: tile
        entity: binary_sensor.vps_lightsail_peer_shield
        name: Shield
      - type: button
        entity: button.vps_lightsail_peer_shield_connect
        name: Connect Shield
        icon: mdi:lan-connect
        tap_action: {action: perform-action, perform_action: button.press,
                     target: {entity_id: button.vps_lightsail_peer_shield_connect}}
      - type: button
        entity: button.vps_lightsail_peer_shield_disconnect
        name: Disconnect Shield
        icon: mdi:lan-disconnect
        tap_action: {action: perform-action, perform_action: button.press,
                     target: {entity_id: button.vps_lightsail_peer_shield_disconnect}}
      - type: picture-entity
        entity: image.vps_lightsail_peer_iphone_qr
        name: iPhone — scan in WireGuard app (+ → Create from QR code)
        show_state: false
peers@popup:        # plan 06e: spec-06 §8.2, the home pop-up gets only the Connect/Disconnect row
  - type: conditional
    conditions:
      - {condition: state, entity: sensor.vps_lightsail_state, state_not: nonexistent}
    card:
      type: grid
      columns: 2
      square: false
      cards:
        - type: button
          entity: button.vps_lightsail_peer_shield_connect
          name: Connect Shield
          icon: mdi:lan-connect
          tap_action: {action: perform-action, perform_action: button.press,
                       target: {entity_id: button.vps_lightsail_peer_shield_connect}}
        - type: button
          entity: button.vps_lightsail_peer_shield_disconnect
          name: Disconnect Shield
          icon: mdi:lan-disconnect
          tap_action: {action: perform-action, perform_action: button.press,
                       target: {entity_id: button.vps_lightsail_peer_shield_disconnect}}
qr: []              # empty on purpose: spec-06 §8.2 keeps the QR picture inside the Devices grid (peers@dashboard)
